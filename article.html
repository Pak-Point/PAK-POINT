async function loadArticle(){try{const snap=await getDoc(doc(db,"articles",articleId));if(!snap.exists()){container.innerHTML='<div class="message"><h2>Article Not Found</h2><p>This article does not exist or has been removed.</p><br><a href="index.html" class="back">← Back to Homepage</a></div>';return}const a=snap.data();if(a.status!=="published"){container.innerHTML='<div class="message"><h2>Article Unavailable</h2><p>This article is not currently available.</p><br><a href="index.html" class="back">← Back to Homepage</a></div>';return}articleTitle=a.title||"Pak Point News";const title=escapeHTML(articleTitle),category=escapeHTML(a.category||"News"),description=escapeHTML(a.description||""),content=escapeHTML(a.content||"No article content available."),date=formatDate(a.date||a.createdAt||a.updatedAt||""),image=getImage(a.image||a.imageUrl||""),video=getImage(a.video);document.title=articleTitle+" | Pak Point";container.innerHTML=`<article class="article-box">${image?`<img class="article-image" src="${image}" alt="${title}" onerror="this.style.display='none';">`:""}<div class="article-body"><span class="badge">${category}</span><h1 class="article-title">${title}</h1><div class="article-meta">Pak Point${date?" • "+escapeHTML(date):""}</div>${description?`<div class="description">${description}</div>`:""}<div class="content">${content}</div>${video?`<video class="article-video" controls preload="metadata"><source src="${video}">Your browser does not support video playback.</video>`:""}<div class="interactions"><button id="likeBtn" class="action-btn" type="button">❤️ Like <span id="likeCount" class="action-count">0</span></button><button id="commentBtn" class="action-btn" type="button">💬 Comment <span id="commentCount" class="action-count">0</span></button><button id="shareBtn" class="action-btn" type="button">📤 Share</button><button id="favoriteBtn" class="action-btn" type="button">⭐ Favorite</button></div><div id="shareMessage" class="share-message">Article link copied.</div><div id="commentsBox" class="comments-box"><h3>Comments</h3><form id="commentForm" class="comment-form"><input id="commentName" maxlength="40" placeholder="Your name" required><textarea id="commentText" maxlength="500" placeholder="Write your comment..." required></textarea><button class="comment-submit" type="submit">Post Comment</button></form><div id="commentList" class="comment-list"></div></div></div></article>`;setupInteractions()}catch(e){console.error(e);container.innerHTML='<div class="message"><h2>Article Load Error</h2><p>Article load nahi ho saka.</p><p>Firebase/Firestore settings check karein.</p><br><a href="index.html" class="back">← Back to Homepage</a></div>'}}
function setupInteractions(){const like=document.getElementById("likeBtn"),fav=document.getElementById("favoriteBtn"),comment=document.getElementById("commentBtn"),share=document.getElementById("shareBtn"),box=document.getElementById("commentsBox"),form=document.getElementById("commentForm");let liked=localStorage.getItem(likeKey)==="1",favorite=localStorage.getItem(favKey)==="1";function render(){like.classList.toggle("active",liked);fav.classList.toggle("active",favorite);document.getElementById("likeCount").textContent=liked?1:0;document.getElementById("commentCount").textContent=readComments().length;fav.innerHTML=favorite?"⭐ Favorited":"⭐ Favorite"}function renderComments(){const list=document.getElementById("commentList"),items=readComments();list.innerHTML=items.length?items.map(c=>`<div class="comment-item"><span class="comment-name">${escapeHTML(c.name)}</span><span class="comment-date">${escapeHTML(c.date)}</span><div class="comment-text">${escapeHTML(c.text)}</div></div>`).join(""):"<div class='no-comments'>No comments yet. Be the first to comment.</div>";document.getElementById("commentCount").textContent=items.length}like.onclick=()=>{liked=!liked;localStorage.setItem(likeKey,liked?"1":"0");render()};fav.onclick=()=>{favorite=!favorite;localStorage.setItem(favKey,favorite?"1":"0");render()};comment.onclick=()=>{box.classList.toggle("show");if(box.classList.contains("show"))box.scrollIntoView({behavior:"smooth",block:"start"})};share.onclick=async()=>{try{if(navigator.share)await navigator.share({title:articleTitle,text:articleTitle,url:location.href});else{await navigator.clipboard.writeText(location.href);const m=document.getElementById("shareMessage");m.classList.add("show");setTimeout(()=>m.classList.remove("show"),2500)}}catch(e){if(e.name!=="AbortError")console.log(e)}};form.onsubmit=e=>{e.preventDefault();const name=document.getElementById("commentName").value.trim(),text=document.getElementById("commentText").value.trim();if(!name||!text)return;c
