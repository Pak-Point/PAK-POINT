  /* =========================================
     FILE UPLOAD
  ========================================= */

  function uploadFile(
    file,
    folder
  ) {

    return new Promise(
      (resolve, reject) => {

        const fileName =
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .substring(2) +
          "_" +
          file.name;


        const storageRef =
          ref(
            storage,
            `${folder}/${fileName}`
          );


        const uploadTask =
          uploadBytesResumable(
            storageRef,
            file
          );


        uploadTask.on(

          "state_changed",

          (snapshot) => {

            const percent =
              Math.round(
                (
                  snapshot.bytesTransferred /
                  snapshot.totalBytes
                ) * 100
              );


            document.getElementById(
              "uploadProgress"
            ).textContent =
              `Uploading ${file.name}: ${percent}%`;

          },


          (error) => {

            reject(error);

          },


          async () => {

            const url =
              await getDownloadURL(
                uploadTask.snapshot.ref
              );


            resolve({

              url: url,

              path:
                uploadTask
                  .snapshot
                  .ref
                  .fullPath

            });

          }

        );

      }
    );

  }



  /* =========================================
     IMAGE COMPRESSION
  ========================================= */

  function prepareArticleImage(
    file
  ) {

    return new Promise(
      (resolve, reject) => {

        if (
          !file ||
          !file.type.startsWith("image/")
        ) {

          reject(
            new Error(
              "Please select a valid image file."
            )
          );

          return;

        }


        const reader =
          new FileReader();


        reader.onerror =
          () => {

            reject(
              new Error(
                "Could not read the selected image."
              )
            );

          };


        reader.onload =
          () => {

            const img =
              new Image();


            img.onerror =
              () => {

                reject(
                  new Error(
                    "Could not process the selected image."
                  )
                );

              };


            img.onload =
              () => {

                const MAX_WIDTH =
                  1200;


                const MAX_HEIGHT =
                  800;


                let width =
                  img.naturalWidth;


                let height =
                  img.naturalHeight;


                const scale =
                  Math.min(
                    1,
                    MAX_WIDTH / width,
                    MAX_HEIGHT / height
                  );


                width =
                  Math.max(
                    1,
                    Math.round(
                      width * scale
                    )
                  );


                height =
                  Math.max(
                    1,
                    Math.round(
                      height * scale
                    )
                  );


                const canvas =
                  document.createElement(
                    "canvas"
                  );


                canvas.width =
                  width;


                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                if (!ctx) {

                  reject(
                    new Error(
                      "Your browser cannot process this image."
                    )
                  );

                  return;

                }


                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );


                const dataUrl =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.78
                  );


                if (
                  dataUrl.length >
                  900000
                ) {

                  reject(
                    new Error(
                      "Image is still too large after compression. Please choose a smaller image."
                    )
                  );

                  return;

                }


                resolve({

                  url: dataUrl,

                  path: ""

                });

              };


            img.src =
              reader.result;

          };


        reader.readAsDataURL(
          file
        );

      }
    );

  }



  /* =========================================
     PUBLISH / UPDATE
  ========================================= */

  publishButton.addEventListener(
    "click",
    async () => {

      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const category =
        document
          .getElementById("category")
          .value;


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const content =
        document
          .getElementById("content")
          .value
          .trim();


      const imageFile =
        document
          .getElementById("imageFile")
          .files[0];


      const videoFile =
        document
          .getElementById("videoFile")
          .files[0];


      if (
        !title ||
        !description ||
        !content
      ) {

        showArticleStatus(
          "Please fill title, short description and full article.",
          "error"
        );

        return;

      }


      publishButton.disabled =
        true;


      publishButton.textContent =
        editingArticleId
        ? "Updating..."
        : "Publishing...";


      document.getElementById(
        "uploadProgress"
      ).textContent = "";


      try {

        let imageData =
          null;


        let videoData =
          null;


        /* IMAGE */

        if (imageFile) {

          document.getElementById(
            "uploadProgress"
          ).textContent =
            "Processing article image...";


          imageData =
            await prepareArticleImage(
              imageFile
            );


          document.getElementById(
            "uploadProgress"
          ).textContent =
            "Article image ready.";

        }


        /* VIDEO */

        if (videoFile) {

          videoData =
            await uploadFile(
              videoFile,
              "articles/videos"
            );

        }


        /* ARTICLE DATA */

        const articleData = {

          title:
            title,

          category:
            category,

          description:
            description,

          content:
            content,

          status:
            "published",

          updatedAt:
            serverTimestamp()

        };


        /* IMAGE */

        if (imageData) {

          articleData.image =
            imageData.url;


          if (imageData.path) {

            articleData.imagePath =
              imageData.path;

          }

        }


        /* VIDEO */

        if (videoData) {

          articleData.video =
            videoData.url;


          articleData.videoPath =
            videoData.path;

        }



        /* NEW ARTICLE */

        if (!editingArticleId) {

          articleData.createdAt =
            serverTimestamp();


          await addDoc(
            collection(
              db,
              "articles"
            ),
            articleData
          );


          showArticleStatus(
            "Article published successfully!",
            "success"
          );

        }


        /* UPDATE ARTICLE */

        else {

          await updateDoc(

            doc(
              db,
              "articles",
              editingArticleId
            ),

            articleData

          );


          showArticleStatus(
            "Article updated successfully!",
            "success"
          );

        }


        clearForm();


        await loadArticles();


      } catch (error) {

        console.error(error);


        showArticleStatus(
          error.message ||
          "Something went wrong.",
          "error"
        );

      }


      publishButton.disabled =
        false;


      publishButton.textContent =
        editingArticleId
        ? "Update Article"
        : "Publish Article";

    }
  );



  /* =========================================
     LOAD ARTICLES
  ========================================= */

  async function loadArticles() {

    const list =
      document.getElementById(
        "articlesList"
      );


    list.innerHTML =
      "Loading articles...";


    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "articles"
          )
        );


      allArticles = [];


      snapshot.forEach(
        (articleDoc) => {

          allArticles.push({

            id:
              articleDoc.id,

            data:
              articleDoc.data()

          });

        }
      );


      updateCategoryStatistics();


      renderArticles();


    } catch (error) {

      console.error(error);


      list.innerHTML =
        `
        <p style="color:red;">
          ${escapeHtml(error.message)}
        </p>
        `;

    }

  }

  function updateCategoryStatistics() {

    const categories = [

      "Motivation",
      "Knowledge",
      "Pakistan",
      "World",
      "Breaking News",
      "Technology",
      "Business",
      "Sports",
      "Entertainment",
      "Health",
      "Education",
      "Other"

    ];


    let html =
      "<strong>Category Posts:</strong><br><br>";


    categories.forEach(
      (category) => {

        const count =
          allArticles.filter(
            (article) =>
              (
                article.data.category ||
                ""
              ) === category
          ).length;


        html +=
          `
          <span style="
            display:inline-block;
            margin:3px 8px 3px 0;
          ">
            ${escapeHtml(category)}:
            <strong>${count}</strong>
          </span>
          `;

      }
    );


    countBox.innerHTML =
      html;

  }



  /* =========================================
     RENDER ARTICLES
  ========================================= */

  function renderArticles() {

    const list =
      document.getElementById(
        "articlesList"
      );


    list.innerHTML =
      "";


    let filteredArticles =
      allArticles;


    if (
      currentFilter !== "ALL"
    ) {

      filteredArticles =
        allArticles.filter(
          (article) =>
            (
              article.data.category ||
              ""
            ) === currentFilter
        );

    }


    if (
      filteredArticles.length === 0
    ) {

      list.innerHTML =
        `
        <div class="empty-message">
          No posts available in
          <strong>
            ${escapeHtml(currentFilter)}
          </strong>.
        </div>
        `;

      return;

    }


    filteredArticles.forEach(
      (article) => {

        createArticleElement(
          article.id,
          article.data,
          list
        );

      }
    );

  }



  /* =========================================
     CREATE ARTICLE CARD
  ========================================= */

  function createArticleElement(
    id,
    data,
    list
  ) {

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "article-item";


    const category =
      data.category ||
      "Other";


    let html =

      `
      <span class="category-label">
        ${escapeHtml(category)}
      </span>

      <h3>
        ${escapeHtml(data.title || "")}
      </h3>

      <div class="article-meta">
        Category:
        ${escapeHtml(category)}
      </div>

      <p>
        ${escapeHtml(
          data.description || ""
        )}
      </p>
      `;



    /* IMAGE */

    if (data.image) {

      html +=

        `
        <img
          src="${escapeHtml(data.image)}"
          class="article-image"
          alt="Article Image"
        >
        `;

    }



    /* VIDEO */

    if (data.video) {

      html +=

        `
        <video
          class="article-video"
          controls
          preload="metadata"
        >
          <source
            src="${escapeHtml(data.video)}"
          >
          Your browser does not support video.
        </video>
        `;

    }



    /* ARTICLE URL */

    const articleUrl =

      new URL(

        "article.html?id=" +
        encodeURIComponent(id),

        window.location.href

      ).href;



    html +=

      `
      <div class="article-url">

        <strong>
          Article URL:
        </strong>

        <br>

        <span>
          ${escapeHtml(articleUrl)}
        </span>

      </div>


      <div class="button-row">

        <button
          class="open-btn"
          data-open
        >
          Open Article
        </button>


        <button
          class="copy-btn"
          data-copy
        >
          Copy URL
        </button>


        <button
          class="update-btn"
          data-edit
        >
          Edit
        </button>


        <button
          class="delete-btn"
          data-delete
        >
          Delete
        </button>

      </div>
      `;



    item.innerHTML =
      html;


    list.appendChild(
      item
    );



    /* OPEN */

    item
      .querySelector(
        "[data-open]"
      )
      .addEventListener(
        "click",
        () => {

          window.location.href =
            articleUrl;

        }
      );



    /* COPY */

    item
      .querySelector(
        "[data-copy]"
      )
      .addEventListener(
        "click",
        async () => {

          try {

            await navigator
              .clipboard
              .writeText(
                articleUrl
              );


            showArticleStatus(
              "Article URL copied successfully!",
              "success"
            );


          } catch (error) {

            window.prompt(
              "Copy this article URL:",
              articleUrl
            );

          }

        }
      );



    /* EDIT */

    item
      .querySelector(
        "[data-edit]"
      )
      .addEventListener(
        "click",
        () => {

          editArticle(id);

        }
      );



    /* DELETE */

    item
      .querySelector(
        "[data-delete]"
      )
      .addEventListener(
        "click",
        () => {

          deleteArticle(id);

        }
      );

  }



  /* =========================================
     EDIT ARTICLE
  ========================================= */

  async function editArticle(
    id
  ) {

    try {

      const article =
        allArticles.find(
          (article) =>
            article.id === id
        );


      if (!article) {

        alert(
          "Article not found."
        );

        return;

      }


      const data =
        article.data;


      editingArticleId =
        id;


      document.getElementById(
        "title"
      ).value =
        data.title || "";


      document.getElementById(
        "category"
      ).value =
        data.category ||
        "Latest Stories";


      document.getElementById(
        "description"
      ).value =
        data.description || "";


      document.getElementById(
        "content"
      ).value =
        data.content || "";


      document.getElementById(
        "formTitle"
      ).textContent =
        "Edit Article";


      publishButton.textContent =
        "Update Article";


      cancelEditButton
        .classList
        .remove(
          "hidden"
        );


      window.scrollTo({

        top: 0,

        behavior:
          "smooth"

      });


    } catch (error) {

      alert(
        error.message
      );

    }

  }



  /* =========================================
     DELETE ARTICLE
  ========================================= */

  async function deleteArticle(
    id
  ) {

    const confirmDelete =
      confirm(
        "Are you sure you want to delete this article?"
      );


    if (!confirmDelete)
      return;


    try {

      await deleteDoc(

        doc(
          db,
          "articles",
          id
        )

      );


      showArticleStatus(
        "Article deleted successfully.",
        "success"
      );


      await loadArticles();


    } catch (error) {

      showArticleStatus(
        error.message,
        "error"
      );

    }

  }



  /* =========================================
     CATEGORY FILTER
  ========================================= */

  document
    .querySelectorAll(
      ".filter-btn"
    )
    .forEach(
      (button) => {

        button.addEventListener(
          "click",
          () => {

            document
              .querySelectorAll(
                ".filter-btn"
              )
              .forEach(
                (btn) => {

                  btn.classList.remove(
                    "active"
                  );

                }
              );


            button.classList.add(
              "active"
            );


            currentFilter =
              button.dataset.filter;


            renderArticles();

          }
        );

      }
    );



  /* =========================================
     CANCEL EDIT
  ========================================= */

  cancelEditButton.addEventListener(
    "click",
    () => {

      clearForm();

    }
  );



  /* =========================================
     CLEAR FORM
  ========================================= */

  function clearForm() {

    editingArticleId =
      null;


    document.getElementById(
      "title"
    ).value =
      "";


    document.getElementById(
      "category"
    ).value =
      "Latest Stories";


    document.getElementById(
      "description"
    ).value =
      "";


    document.getElementById(
      "content"
    ).value =
      "";


    document.getElementById(
      "imageFile"
    ).value =
      "";


    document.getElementById(
      "videoFile"
    ).value =
      "";


    document.getElementById(
      "formTitle"
    ).textContent =
      "Publish New Article";


    publishButton.textContent =
      "Publish Article";


    cancelEditButton
      .classList
      .add(
        "hidden"
      );


    document.getElementById(
      "uploadProgress"
    ).textContent =
      "";

  }



  /* =========================================
     STATUS
  ========================================= */

  function showArticleStatus(
    message,
    type
  ) {

    articleStatus.style.display =
      "block";


    articleStatus.className =
      "status " +
      type;


    articleStatus.textContent =
      message;

  }



  /* =========================================
     ESCAPE HTML
  ========================================= */

  function escapeHtml(
    text
  ) {

    const div =
      document.createElement(
        "div"
      );


    div.textContent =
      text;


    return div.innerHTML;

  }


</script>

</body>
</html>
