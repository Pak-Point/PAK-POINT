name: Pak Point Professional Theme

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  redesign:
    if: ${{ !contains(github.event.head_commit.message, 'Apply professional theme') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply professional theme
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* Pak Point Professional News Theme */
          :root{--navy:#0b1f33;--navy2:#123b5d;--accent:#d6a84f;--bg:#f4f6f8;--text:#17212b;--muted:#66727e}
          body{background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
          header{background:linear-gradient(135deg,var(--navy),var(--navy2));padding:13px 20px;box-shadow:0 3px 14px rgba(0,0,0,.16)}
          .header-container{max-width:1200px}
          .logo{font-size:28px;letter-spacing:.2px}
          nav a{font-size:14px;font-weight:600;border-radius:7px;padding:8px 10px}
          nav a:hover{background:rgba(214,168,79,.18);color:#fff}
          .breaking-bar{background:#fff;color:var(--navy);border-bottom:2px solid var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.06)}
          .breaking-label{background:#b52b2b}
          .hero{background:linear-gradient(135deg,#102f4b,#17627c 55%,#0f766e);padding:52px 20px 58px}
          .hero h1{font-size:42px;font-weight:800}
          .hero p{font-size:19px}
          .search-box input{border:1px solid #dce2e7;background:#fff;box-shadow:0 5px 18px rgba(0,0,0,.14)}
          .search-box button{background:var(--accent);color:#102033;font-weight:800;box-shadow:0 5px 18px rgba(0,0,0,.14)}
          .search-box button:hover{background:#c79838}
          main{max-width:1240px}
          .section-title{color:var(--navy);border-left-color:var(--accent)}
          .card{border:1px solid #e3e7eb;border-radius:12px;background:#fff;box-shadow:0 3px 12px rgba(11,31,51,.07)}
          .card:hover{transform:translateY(-4px);box-shadow:0 9px 24px rgba(11,31,51,.13)}
          .category{background:var(--navy);color:#fff}
          .read-article{color:var(--navy)}
          .contact-box{border-top:4px solid var(--accent)}
          footer{background:var(--navy)!important;color:#fff}
          @media(max-width:700px){header{padding:11px 14px}.logo{font-size:24px}.hero{padding:35px 16px 40px}.hero h1{font-size:31px}.hero p{font-size:16px}.search-box button{background:var(--accent);color:#102033}.section-title{font-size:23px}}
          '''
          if 'Pak Point Professional News Theme' not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit professional theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply professional theme"
          git push
